name: Remote Studio verified installer submission
on:
  workflow_call:
    inputs:
      targets:
        type: string
        required: true
      signed:
        type: boolean
        default: false
    secrets:
      DOWNLOADS_APP_PRIVATE_KEY:
        required: false
      DOWNLOADS_RELEASE_TOKEN:
        required: false
      CSC_LINK:
        required: false
      CSC_KEY_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-release-ref.mjs
      - name: Check download repository credential configuration
        env:
          DOWNLOAD_REPOSITORY: ${{ vars.REMOTE_STUDIO_DOWNLOAD_REPOSITORY }}
          APP_ID: ${{ vars.DOWNLOADS_APP_ID }}
          APP_KEY: ${{ secrets.DOWNLOADS_APP_PRIVATE_KEY }}
          RELEASE_TOKEN: ${{ secrets.DOWNLOADS_RELEASE_TOKEN }}
        run: |
          node --input-type=module -e 'if (!process.env.DOWNLOAD_REPOSITORY || !(process.env.APP_ID && process.env.APP_KEY || process.env.RELEASE_TOKEN)) throw new Error("Configure REMOTE_STUDIO_DOWNLOAD_REPOSITORY and a scoped GitHub App or DOWNLOADS_RELEASE_TOKEN on the source repo before tagging.");'
  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    environment: release-signing-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:sdk
      - run: pnpm check:public
      - run: pnpm check:release
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright test
      - name: Build verified installers and artifact metadata
        env:
          SIGNED_RELEASE: ${{ inputs.signed }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_ARCH: ${{ matrix.arch }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/build-release.mjs
      - name: Check packaged enforcement and recovery on this runner
        shell: pwsh
        run: |
          if ($IsWindows) {
            $env:STUDIO_ELECTRON_EXE = (Resolve-Path 'release/win-unpacked/Remote Studio.exe').Path
          } elseif ('${{ matrix.arch }}' -eq 'arm64') {
            $env:STUDIO_ELECTRON_EXE = (Resolve-Path 'release/mac-arm64/Remote Studio.app/Contents/MacOS/Remote Studio').Path
          } else {
            $env:STUDIO_ELECTRON_EXE = (Resolve-Path 'release/mac/Remote Studio.app/Contents/MacOS/Remote Studio').Path
          }
          $env:STUDIO_NATIVE_NODE = $env:STUDIO_ELECTRON_EXE
          if ($IsWindows) {
            $env:STUDIO_NATIVE_SERVICES = (Resolve-Path 'release/win-unpacked/resources/services').Path
          } elseif ('${{ matrix.arch }}' -eq 'arm64') {
            $env:STUDIO_NATIVE_SERVICES = (Resolve-Path 'release/mac-arm64/Remote Studio.app/Contents/Resources/services').Path
          } else {
            $env:STUDIO_NATIVE_SERVICES = (Resolve-Path 'release/mac/Remote Studio.app/Contents/Resources/services').Path
          }
          pnpm exec vitest run tests/integration/native-workflow.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec playwright test tests/e2e/license.spec.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-desktop.mjs --executable "$env:STUDIO_ELECTRON_EXE" --recovery
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: remote-studio-installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/remote-studio-*.dmg
            release/remote-studio-*.exe
            release/artifacts-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-studio-acceptance-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            test-results/
            test-artifacts/
  upload:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release-upload
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: remote-studio-installers-*
          merge-multiple: true
          path: release
      - run: node scripts/merge-release-manifests.mjs
        env:
          REMOTE_STUDIO_RELEASE_TARGETS: ${{ inputs.targets }}
      - name: Create scoped download repository token
        if: ${{ vars.DOWNLOADS_APP_ID != '' }}
        id: downloads-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DOWNLOADS_APP_ID }}
          private-key: ${{ secrets.DOWNLOADS_APP_PRIVATE_KEY }}
          owner: ${{ vars.DOWNLOADS_REPOSITORY_OWNER || github.repository_owner }}
          repositories: ${{ vars.DOWNLOADS_REPOSITORY_NAME || 'remote-studio-releases' }}
          permission-contents: write
          permission-administration: read
      - name: Publish immutable installers and submit to Store for verification
        run: node scripts/upload-store-release.mjs
        env:
          T2E_DOWNLOAD_REPOSITORY: ${{ vars.REMOTE_STUDIO_DOWNLOAD_REPOSITORY }}
          T2E_GITHUB_RELEASES_TOKEN: ${{ steps.downloads-token.outputs.token || secrets.DOWNLOADS_RELEASE_TOKEN }}
      - name: Store publication remains a separate admin step
        run: echo "Installers are public on the downloads repo. Wait for READY in Store Admin, then publish the release and product there."
