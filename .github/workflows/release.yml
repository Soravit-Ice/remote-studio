name: Tagged release to T2ETECH Store
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: remote-studio-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    uses: Soravit-Ice/remote-studio/.github/workflows/store-release.yml@main
    with:
      signed: ${{ vars.REMOTE_STUDIO_SIGNED_RELEASE == 'true' }}
      targets: ${{ vars.REMOTE_STUDIO_RELEASE_TARGETS || '[{"runner":"macos-latest","platform":"darwin","arch":"arm64"},{"runner":"macos-15-intel","platform":"darwin","arch":"x64"},{"runner":"windows-2025","platform":"win32","arch":"x64"}]' }}
    secrets:
      DOWNLOADS_APP_PRIVATE_KEY: ${{ secrets.DOWNLOADS_APP_PRIVATE_KEY }}
      DOWNLOADS_RELEASE_TOKEN: ${{ secrets.DOWNLOADS_RELEASE_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
