<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Remote Studio</title>
    <link rel="stylesheet" href="/startup.css" />
    <script src="/startup.js"></script>
  </head>
  <body>
    <div id="root">
      <div id="studio-boot" class="startup" role="status">
        <h1>Starting Remote Studio</h1>
        <p id="studio-boot-message">Loading your local workspace…</p>
        <button id="studio-boot-reload" class="startup-reload" hidden>
          Try again
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
